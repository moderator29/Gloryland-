<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <title>Rigel Capital, digital asset vaults</title>
    <meta
      name="description"
      content="Rigel is a private capital platform. Place capital into a vault for a fixed 30-day term and watch it accrue every day."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rigel" />
    <meta property="og:title" content="Rigel Capital, digital asset vaults" />
    <meta
      property="og:description"
      content="Private capital infrastructure. Fixed 30-day vault terms, accruing daily."
    />
    <meta property="og:type" content="website" />
    <!--
      Type is served from our own origin, declared in src/fonts.css. The two
      faces that are on screen at first paint are preloaded so the swap happens
      before the member can read a word in the fallback.
    -->
    <link
      rel="preload"
      href="/fonts/inter-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

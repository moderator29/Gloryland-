name: verify

# Runs on every push and every pull request. The point is that a defect in the
# derivation, a type error, or a claim that drifted out of agreement with the
# ledger fails here rather than on the deploy runner or, worse, in front of a
# member.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  # A newer push supersedes an older run on the same branch.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Frozen, so a lockfile that has drifted from package.json fails here
      # rather than resolving to something nobody chose.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck, app and API
        run: pnpm run typecheck

      - name: Derivation assertions
        run: pnpm run check

      # The test toolchain is installed here rather than declared in
      # package.json. The deploy runner verifies the lockfile against a supply
      # chain policy before it installs anything, and the lockfile that passes
      # today is the one without these two hundred odd extra entries. Keeping
      # them out of it means a test dependency can never be the reason a deploy
      # fails, and CI is the only place they are needed.
      - name: Install the test toolchain
        run: pnpm run test:install

      - name: Typecheck the tests
        run: pnpm run typecheck:test

      - name: Tests
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Two rules the product holds itself to that are cheap to enforce and
      # expensive to notice by eye.
      # Test files are excluded: the test that guards this rule has to contain
      # the character it guards against.
      - name: No em dashes in shipped source
        run: |
          if grep -rn $'—\|–' src/ api/ index.html \
              --include='*.ts' --include='*.tsx' --include='*.css' --include='*.html' \
              --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.check.ts'; then
            echo "::error::An em or en dash reached the source. Use a comma, a colon or a full stop."
            exit 1
          fi

      # Deposit addresses are real, and they live in exactly one file. Anywhere
      # else is a second place a member could be sent, and a stale second place
      # is the original defect wearing different clothes.
      #
      # Matched on the values themselves rather than on the shape of an
      # address. The shape catches the USDT contract and every test fixture,
      # which are not deposit addresses and never were, and a check that cries
      # wolf is a check people learn to skip. `npm run check` and
      # `assets.test.ts` pin the values from the other two directions.
      - name: Deposit addresses live in one place
        run: |
          stray=$(grep -rlF \
              -e 'bc1qn9wf60cha6a4h4dfsslutksvv04amlz6hwmch0' \
              -e '0xa6594edf7415f5dcf599c3249fbf2ab948978799' \
              -e 'EHwKKSQcJQSbTxKKdbzzbMQUVZQZGiiD1GcUVYdCPsCc' \
              src/ api/ \
              | grep -v '^src/features/market/assets.ts$' \
              | grep -v '^src/features/market/assets.test.ts$' \
              | grep -v '^src/lib/qr.check.ts$' || true)
          if [ -n "$stray" ]; then
            echo "::error::A deposit address literal reached $stray. They belong in src/features/market/assets.ts only."
            exit 1
          fi
